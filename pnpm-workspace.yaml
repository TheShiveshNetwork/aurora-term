packages:
  - "app"
  - "site/web"
  - "packages/*"

# NOTE: site/supabase is intentionally NOT a pnpm workspace package. It is a
# Deno project (Edge Function) with its own deno.json and is deployed to
# Supabase — its dependencies (e.g. hono) live in the Deno runtime, never in
# node_modules and never in the Tauri build.

allowBuilds:
  esbuild: true
