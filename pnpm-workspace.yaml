packages:
  - "app"
  - "site/web"
  - "packages/*"

# NOTE: site/cloudflare is intentionally NOT a pnpm workspace package. It is a
# Cloudflare Worker project with its own wrangler.toml/package.json (wrangler +
# TypeScript only) and is deployed to Cloudflare — its dependencies live in the
# worker runtime, never in node_modules and never in the Tauri build.

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@mastra/libsql@1.22.0'
