name: Mirror LSP bundles to Supabase bucket

# Runs after the LSP bundle build workflow uploads a new rolling `lsp-bundles`
# release. It waits for the assets to be present, then triggers the aurora-api
# edge function, which re-hosts the LSP binaries into the public `aurora`
# Storage bucket and returns versioned URLs.
#
# Note: the LSP bundles ship as a rolling release updated in place, so a
# `release: published` event would only fire once. We instead hook the build
# workflow's completion via `workflow_run`.
on:
  workflow_run:
    workflows: ["LSP Bundles: Build & Publish"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mirror-lsp-store
  cancel-in-progress: false

jobs:
  mirror:
    # Only when the build actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for LSP bundle assets to be uploaded
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: lsp-bundles
        run: |
          ready=false
          for i in $(seq 1 30); do
            count=$(gh release view "$TAG" --json assets \
              -q '.assets | map(select((.name | test("\\.(tar\\.gz|zip)$")) or (.name == "manifest.json"))) | length' || echo 0)
            echo "Attempt $i: $count LSP asset(s) found"
            if [ "$count" -gt 0 ]; then ready=true; break; fi
            sleep 20
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "No LSP bundle assets found after waiting; leaving the bucket untouched."
          fi

      - name: Trigger Supabase LSP mirror
        if: steps.assets.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_TOKEN: ${{ secrets.SUPABASE_FUNCTION_TOKEN }}
        run: |
          curl -fS --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL}/functions/v1/aurora-api/v1/update/lsp/store" \
            -H "Authorization: Bearer ${SUPABASE_FUNCTION_TOKEN}"

      - name: Show resulting package URLs
        if: steps.assets.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_TOKEN: ${{ secrets.SUPABASE_FUNCTION_TOKEN }}
        run: |
          curl -fsS "${SUPABASE_URL}/functions/v1/aurora-api/v1/update/lsp/store" \
            -H "Authorization: Bearer ${SUPABASE_FUNCTION_TOKEN}"
