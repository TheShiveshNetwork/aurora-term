name: 'release'
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--verbose'
          - platform: 'ubuntu-22.04-arm'
            args: '--verbose'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libsecret-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            zsync \
            libgtk-3-dev \
            pkg-config \
            libglib2.0-dev


      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './tauri -> target'

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('tauri/tauri.conf.json','utf8')).version)")
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch tauri.conf.json version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('tauri/tauri.conf.json','utf8'));
            c.version = '${{ steps.version.outputs.VERSION }}';
            fs.writeFileSync('tauri/tauri.conf.json', JSON.stringify(c,null,2) + '\n');
          "

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'Aurora ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
