name: 'ci'

# Cheap cross-platform compile gate for PRs. It runs `cargo check` (and clippy)
# on Windows, macOS and Linux so platform-specific errors like non-exhaustive
# match arms are caught before merge, without the expensive Tauri bundling step
# (WebKit, code signing, app packaging) that only the release workflow does.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'macos-latest'
          - platform: 'ubuntu-22.04'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            pkg-config \
            libglib2.0-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: 'clippy'

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
