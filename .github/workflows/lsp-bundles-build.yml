name: "LSP Bundles: Build & Publish"

on:
  push:
    branches: [main]
    paths: ["aurora-lsp-bundles/scripts/**", "aurora-lsp-bundles/manifest.json"]
  workflow_dispatch:
  schedule:
    # Re-publish nightly so freshly-merged version bumps ship.
    - cron: "17 3 * * *"

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora-lsp-bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Build all bundles + manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs
