name: 'changelog'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full history to resolve the root commit and to
          # split it into per-release sections. Without this it renders nothing.
          fetch-depth: 0
          # Base the changelog on main rather than the detached tag ref: the
          # file is regenerated into the branch, not into the tag.
          ref: main

      - name: Compute changelog range
        id: range
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Regenerate the whole file from the very first commit up to the tag, so
          # nothing is ever lost and no release can be inserted twice. `head -n 1`
          # keeps a grafted or multi-root history from producing a broken range.
          ROOT=$(git rev-list --max-parents=0 HEAD | head -n 1)
          echo "range=$ROOT..$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
        with:
          config: cliff.toml
          # An explicit range is used instead of --tag or --latest. --tag also
          # renders commits pushed after the tag, which duplicates the heading and
          # leaks unreleased work into the notes; --latest renders only the newest
          # release, so it would need --prepend to preserve older ones.
          args: ${{ steps.range.outputs.range }}

      - name: Commit changelog to a branch
        id: changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          BRANCH: changelog/${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Re-running a tag should not create an empty commit.
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already matches $TAG, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for $TAG"

          # Someone may have pushed to main while this job was generating the
          # file; rebase so the pull request never conflicts and carries only the
          # changelog change.
          git fetch origin main
          git rebase origin/main

          git push --force-with-lease origin "$BRANCH"
          echo "Pushed $BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open changelog pull request
        if: steps.changelog.outputs.changed == 'true'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          BRANCH: changelog/${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Re-running a tag re-pushes the same branch, so update the existing
          # pull request instead of opening a duplicate.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already covers $BRANCH; the push above updated it."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs(changelog): update for $TAG" \
            --body "Automated changelog regeneration for \`$TAG\`.

          Regenerated from \`cliff.toml\` over the full history up to \`$TAG\`."

          echo "::notice::A push from GITHUB_TOKEN queues this pull request's checks"
          echo "::notice::behind an approval gate. Click 'Approve workflows to run'"
          echo "::notice::in the merge box, then merge."