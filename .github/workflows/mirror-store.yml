name: Mirror release binaries to Supabase Store bucket

# Mirrors one release's installer assets to Supabase. release.yml dispatches this
# workflow after all platform builds finish. The release-published trigger below
# remains for releases published by hand; it is not a reliable signal
# that automated build assets are complete.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror (defaults to the latest published release)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mirror-store-${{ github.event.release.tag_name || github.event.inputs.tag || 'manual' }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # SUPABASE_URL and SUPABASE_FUNCTION_TOKEN are production environment
    # secrets. GitHub only exposes environment secrets to jobs that declare
    # the same environment.
    environment: production
    # `gh` needs the repo explicitly here because the workflow does not check out
    # the code (no git tree) — otherwise it fails with
    # "fatal: not a git repository".
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Resolve which release to mirror:
          #   - release event      -> use the published release's tag
          #   - manual + tag input -> use that tag
          #   - manual, no input   -> latest published, non-draft, non-prerelease
          TAG=""
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release list -R "$REPO" --limit 50 --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft==false and .isPrerelease==false) | .tagName' \
              | head -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a release tag to mirror." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Validate app release tag
        id: tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # Only stable app releases (vX.Y.Z); skip LSP / other tags.
          if echo "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_app=false" >> "$GITHUB_OUTPUT"
            echo "Tag '$TAG' is not a stable app version; skipping mirror."
          fi

      - name: Wait for installer assets to be uploaded
        id: assets
        if: steps.tag.outputs.is_app == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ready=false
          for i in $(seq 1 30); do
            count=$(gh release view "$TAG" -R "$REPO" --json assets \
              -q '.assets | map(select(.name | test("\\.(exe|msi|dmg|app\\.tar\\.gz|AppImage|deb|rpm)$"))) | length')
            echo "Attempt $i: $count installer asset(s) found"
            if [ "$count" -gt 0 ]; then ready=true; break; fi
            sleep 20
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "No installer assets found after waiting; leaving the bucket untouched."
          fi

      - name: Validate Supabase configuration
        id: supabase
        if: steps.assets.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_TOKEN: ${{ secrets.SUPABASE_FUNCTION_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL is not set, so the mirror request has no host."
            echo "::error::Add the Supabase project URL as a repository secret."
            exit 1
          fi
          root="$(printf '%s' "$SUPABASE_URL" | sed 's:/*$::')"
          if ! [[ "$root" =~ ^https://[^/?#]+$ ]]; then
            echo "::error::SUPABASE_URL must be the project root, without a path."
            echo "::error::Use a URL such as https://xyzcompany.supabase.co, not a functions URL."
            exit 1
          fi
          if [ -z "${SUPABASE_FUNCTION_TOKEN:-}" ]; then
            echo "::error::SUPABASE_FUNCTION_TOKEN is not set, so the mirror request cannot authenticate."
            echo "::error::Add the token expected by AURORA_DEPLOY_TOKEN as a repository secret."
            exit 1
          fi

          endpoint="$root/functions/v1/aurora-api"
          health_body=$(mktemp)
          health_status=0
          if ! health_status=$(curl -sS -o "$health_body" -w '%{http_code}' --retry 3 --retry-delay 5 "$endpoint/v1/health"); then
            health_status="curl-failed"
          fi
          health_text=$(cat "$health_body")
          rm -f "$health_body"
          if [ "$health_status" != "200" ]; then
            echo "::error::The Supabase function endpoint returned HTTP $health_status."
            printf '%s\n' "$health_text"
            if [ "$health_status" = "404" ]; then
              echo "::error::Deploy aurora-api from site/supabase, then rerun this workflow:"
              echo "::error::supabase functions deploy aurora-api --no-verify-jwt"
            fi
            exit 1
          fi
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Trigger Supabase mirror
        if: steps.assets.outputs.ready == 'true'
        env:
          ENDPOINT: ${{ steps.supabase.outputs.endpoint }}
          SUPABASE_FUNCTION_TOKEN: ${{ secrets.SUPABASE_FUNCTION_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          response_body=$(mktemp)
          response_status=0
          if ! response_status=$(curl -sS -o "$response_body" -w '%{http_code}' --retry 3 --retry-delay 10 \
            -X POST "$ENDPOINT/v1/update/store?repo=$REPO&tag=$TAG" \
            -H "Authorization: Bearer ${SUPABASE_FUNCTION_TOKEN}"); then
            response_status="curl-failed"
          fi
          response_text=$(cat "$response_body")
          rm -f "$response_body"

          if [ "$response_status" = "200" ]; then
            echo "Mirror request accepted."
            exit 0
          fi
          printf '%s\n' "$response_text"
          if [ "$response_status" = "400" ]; then
            echo "::error::Supabase rejected the requested release target."
            echo "::error::Expected a stable app tag such as v1.0.1; received '$TAG'."
          elif [ "$response_status" = "401" ]; then
            echo "::error::Supabase rejected the mirror token."
            echo "::error::Set GitHub SUPABASE_FUNCTION_TOKEN to the deployed AURORA_DEPLOY_TOKEN."
          elif [ "$response_status" = "404" ] && grep -Fq '"error":"no app release"' <<<"$response_text"; then
            echo "::error::Supabase accepted the token but found no app release."
            echo "::error::Check that AURORA_GITHUB_REPO is set to $REPO on the deployed function."
            echo "::error::If it is set, inspect the function logs for a GitHub API failure and consider AURORA_GITHUB_TOKEN."
          elif [ "$response_status" = "500" ]; then
            echo "::error::The Supabase mirror request failed inside the edge function."
            echo "::error::Inspect the aurora-api function logs for the failed asset or storage operation."
          else
            echo "::error::The Supabase mirror request returned HTTP $response_status."
          fi
          exit 1

      # Confirm the edge function re-hosted the installers into the `aurora`
      # bucket and wrote the new row (with the bucket `download_url`) into
      # `release_cache`. Poll because the function may still be mirroring.
      - name: Verify release_cache updated
        if: steps.assets.outputs.ready == 'true'
        env:
          ENDPOINT: ${{ steps.supabase.outputs.endpoint }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          expected="${TAG#v}"
          for i in $(seq 1 12); do
            body=$(curl -fsS "$ENDPOINT/v1/update/latest" || true)
            ver=$(printf '%s' "$body" | grep -o '"version":"[^"]*"' | head -1 | sed 's/"version":"//;s/"//')
            echo "Cached version: '${ver}' (expected '${expected}')"
            if [ "$ver" = "$expected" ]; then
              echo "release_cache updated successfully (bucket download_url shown below):"
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::release_cache was not updated to ${expected} within timeout"
