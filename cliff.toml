# git-cliff configuration for Aurora Term.
#
# Used only by .github/workflows/changelog.yml, which runs on the CI runner.
# Nothing here is a build input: it is not referenced by Cargo.toml,
# tauri/tauri.conf.json, or any pnpm script, so it never reaches the app bundle.
#
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Aurora Term are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Entries are generated by [git-cliff](https://git-cliff.org) from the commit
history on every `v*` tag push. Do not edit this file by hand.
"""

# Unused while the workflow regenerates the whole file, but keep it consistent
# with the header so a future --prepend based job still works.
header_marker = "<!-- git-cliff: end of header -->"

# The first release has no previous tag, so it gets a plain heading instead of a
# compare link pointing at nothing.
body = """
{% if previous.version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/TheShiveshNetwork/aurora-term/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""

trim = true
output = "CHANGELOG.md"

# `trim = true` strips the body template's trailing newline, which would leave
# release headings glued to the previous line. Each body is postprocessed
# individually before the renderer joins them, so append the blank separator at
# the end of every release body.
postprocessors = [
  { pattern = '$', replace = "\n" },
]

[git]
conventional_commits = true

# Most commits here are squash-merged PR titles ("Fixes in the application
# (#82)") and are not conventional commits. Keep them under "Other" rather than
# dropping them.
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
sort_commits = "oldest"

# Semver tags only, so the `lsp-bundles` tag is never treated as a release
# boundary.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"

commit_preprocessors = [
  # Squash merges carry the PR number as a " (#123)" suffix on the subject line.
  # Turn it into a real link instead of a dead "#123".
  { pattern = "\\(#(\\d+)\\)", replace = "[#${1}](https://github.com/TheShiveshNetwork/aurora-term/pull/${1})" },
  # Collapse the whitespace left behind by that substitution.
  { pattern = " +", replace = " " },
  # Squash-merged PR bodies get copied into the commit body and would otherwise
  # flood the entry with bullet lists. Keep the subject line only.
  { pattern = '(?s)\n.*', replace = "" },
]

commit_parsers = [
  # Skip the bot commits this workflow creates so they never leak into the next
  # release's notes.
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^revert", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Styling" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^(build|ci)", group = "Build and CI" },
  { message = "^chore", group = "Chores" },
  { message = ".*", group = "Other" },
]